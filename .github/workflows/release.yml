# Two ways in, one artifact. A push to main that touches code is a beta build: the
# VERSION series plus the commit count, published as a prerelease. A vX.Y.Z tag is a hand-cut
# stable release. Every release carries both packages, the MSI and the zip, because
# which one an install can apply depends on how it was installed. Promoting a tested
# beta is a flag flip on its release, never a rebuild - see
# docs/development/releasing.md. Unsigned by design until a sanctioned certificate
# exists. workflow_dispatch is the dry run: artifact only.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Dry run - build the MSI as an artifact only (x.y.z)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A push that only moved docs is not a build. Tags and dry runs always are.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ship: ${{ steps.decide.outputs.ship }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this push is a build
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A force push or a new branch leaves no usable base, so fall back one commit.
          base='${{ github.event.before }}'
          git cat-file -e "$base^{commit}" 2>/dev/null || base='HEAD^'
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # An empty diff ships, rather than reading "nothing to compare" as "do not build".
          if echo "$changed" | grep -qvE '^(docs|web)/'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

  msi:
    needs: guard
    if: needs.guard.outputs.ship == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: the beta build numbers itself off the commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Its own prefix because the self-contained publish restores a RID-specific set CI never pulls.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-selfcontained-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-selfcontained-
            nuget-

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } elseif ($isTag) {
              '${{ github.ref_name }}'.TrimStart('v')
          } else {
              "$((Get-Content VERSION -Raw).Trim()).$(git rev-list --count HEAD)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "beta=$(if ($isTag) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Build MSI
        id: build
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          ./tools/Build-Installer.ps1 -Version $version -SkipSigning
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory $dist | Out-Null

          $msi = Get-ChildItem installer/bin -Recurse -Filter DONUT.msi | Select-Object -First 1
          Copy-Item $msi.FullName (Join-Path $dist 'DONUT.msi')

          # The MSI's own staged payload, flat, for installs msiexec does not own. Its
          # VERSION rides inside: a zip install has no uninstall key to read one from.
          $stage = (Resolve-Path installer/obj/stage).Path
          $version | Set-Content (Join-Path $stage 'VERSION') -NoNewline
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, (Join-Path $dist 'DONUT.zip'))

          # A checksum each, since which package an install applies depends on the install.
          foreach ($name in 'DONUT.msi', 'DONUT.zip') {
              $hash = (Get-FileHash (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLower()
              "$hash  $name" | Set-Content (Join-Path $dist "$name.sha256") -NoNewline
          }
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: DONUT-packages
          path: ${{ steps.build.outputs.dist }}

      # A beta creates its own tag here; a stable one was pushed by hand, so it is verified.
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = '${{ steps.build.outputs.dist }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $kind = if ('${{ steps.ver.outputs.beta }}' -eq 'true') { '--prerelease' } else { '--verify-tag' }
          $assets = Get-ChildItem $dist | ForEach-Object { $_.FullName }
          gh release create $tag $assets `
              --title "DONUT $tag" --target '${{ github.sha }}' --generate-notes $kind
