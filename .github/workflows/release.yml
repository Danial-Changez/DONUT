# Two ways in, one artifact. A push to main is a beta build: the VERSION series
# plus the commit count, published as a prerelease. A vX.Y.Z tag is a hand-cut
# stable release. Promoting a tested beta is a flag flip on its release, never a
# rebuild - see docs/development/releasing.md. The MSI is unsigned by design until
# a sanctioned certificate exists. workflow_dispatch is the dry run: artifact only.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Dry run - build the MSI as an artifact only (x.y.z)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: the beta build numbers itself off the commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Its own prefix because the self-contained publish restores a RID-specific set CI never pulls.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-selfcontained-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-selfcontained-
            nuget-

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } elseif ($isTag) {
              '${{ github.ref_name }}'.TrimStart('v')
          } else {
              "$((Get-Content VERSION -Raw).Trim()).$(git rev-list --count HEAD)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "beta=$(if ($isTag) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Build MSI
        id: build
        shell: pwsh
        run: |
          ./tools/Build-Installer.ps1 -Version '${{ steps.ver.outputs.version }}' -SkipSigning
          $msi = Get-ChildItem installer/bin -Recurse -Filter DONUT.msi | Select-Object -First 1
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item $msi.FullName (Join-Path $dist 'DONUT.msi')
          $hash = (Get-FileHash (Join-Path $dist 'DONUT.msi') -Algorithm SHA256).Hash.ToLower()
          "$hash  DONUT.msi" | Set-Content (Join-Path $dist 'DONUT.msi.sha256') -NoNewline
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DONUT-msi
          path: ${{ steps.build.outputs.dist }}

      # A beta creates its own tag here; a stable one was pushed by hand, so it is verified.
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = '${{ steps.build.outputs.dist }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $kind = if ('${{ steps.ver.outputs.beta }}' -eq 'true') { '--prerelease' } else { '--verify-tag' }
          gh release create $tag `
              (Join-Path $dist 'DONUT.msi') `
              (Join-Path $dist 'DONUT.msi.sha256') `
              --title "DONUT $tag" --target '${{ github.sha }}' --generate-notes $kind
