# The app gate: format, lint, tests, launcher build - each one a repo script
# (tools/) so CI and a local run are the same command. Docs and the site have
# their own pipelines (docs.yml, web-check.yml); the remote-lab harness
# (tools/Invoke-DiagnosticRun.ps1) is manual-only - see
# docs/development/testing.md. Test suite needs Windows: WPF tests run STA.
# No path filter: a filtered run never reports, and these are main's required checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A read-only token: every job here checks out, builds and tests, nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Separate jobs rather than one so a format nit stops hiding the test results
# behind it. Pester's own Run.Parallel cannot replace any matrix here: nearly
# every test file opens with `using module`, and concurrent class-graph
# compiles deadlock on the module-load lock (docs/development/decisions.md).
# That lock is per-process, so the deadlock never crosses runners: shards on
# separate VMs share nothing, which is what lets the Unit suite split below.
jobs:
  # Split from lint, which takes an order of magnitude longer: a brace nit should
  # not report four minutes late because an analyzer pass was queued in front of it.
  # The two languages split again between runners: serial, their checks stacked to
  # ~60s of a ~73s job, the run's would-be floor once the Unit suite sharded.
  format-shard:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      # Both halves report, so a PowerShell nit does not hide a C# one.
      fail-fast: false
      matrix:
        language: [PowerShell, CSharp]
    steps:
      - uses: actions/checkout@v7

      # No cache: the runner image ships PSScriptAnalyzer, and neither job wants Pester.
      - name: Install PowerShell modules
        if: matrix.language == 'PowerShell'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Format check
        if: matrix.language == 'PowerShell'
        shell: pwsh
        run: ./tools/Invoke-Format.ps1 -Check

      # The C# half of the layout rules (.editorconfig): 1TBS braces, verified not rewritten.
      # It lives here, not in build: whitespace formatting needs no restore, so the nit
      # reports beside the PowerShell one instead of behind a package cache.
      # No setup-dotnet: the image ships the .NET 10 SDK and no global.json pins a
      # patch, so the action only spent seconds confirming "already installed".
      # If the image ever drops the major, restore the pin (release.yml keeps one).
      - name: Format check (C#)
        if: matrix.language == 'CSharp'
        run: dotnet format whitespace src/Launcher/Donut.Launcher.csproj --no-restore --verify-no-changes

  # Branch protection requires a check named format, and a required check matches
  # by name: the shards report per language, so this one job answers for both.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: format-shard
    # always(), or a failed shard skips this job and the required check never lands.
    if: always()
    steps:
      - name: Fail on any failed shard
        if: needs.format-shard.result != 'success'
        run: exit 1

  lint-shard:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, and a shard is a whole process: the analyzer session
      # stays serial (splitting one session changes its findings, see the tool's
      # notes), so the parallelism lives between runners, never inside a session.
      # Cut so no shard outruns the longest test shard: locally Unit is 69s of
      # tests' 83, src 44, tools 31, the rest under 20.
      fail-fast: false
      matrix:
        scope: ['src', 'tests/Unit', 'tests/Integration tests/Helpers', 'tools']
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR scope below diffs against the base branch.
          fetch-depth: 0

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      # A PR lints the files it changed; a push to main lints everything, so nothing
      # hides for longer than one merge. Rules are per-file, which is what makes the
      # scopes agree, so a change to the rules themselves re-scopes the PR to full.
      - name: Lint
        shell: pwsh
        run: |
          $roots = '${{ matrix.scope }}' -split ' '
          # The first shard also proves no tests file escaped the shard list.
          if ($roots[0] -eq 'src') {
              $shards = 'tests/Unit', 'tests/Integration', 'tests/Helpers'
              $stray = @(git ls-files 'tests/*.ps1' 'tests/*.psm1' | Where-Object {
                      $f = $_; -not ($shards | Where-Object { $f -like "$_/*" })
                  })
              if ($stray) { throw "Not covered by any lint shard: $($stray -join ', ')" }
          }
          $full = '${{ github.event_name }}' -ne 'pull_request'
          $changed = @()
          if (-not $full) {
              $changed = @(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
              $ruleFiles = '^(tools/Invoke-Lint\.ps1|tools/CommentRules\.ps1|tools/Rules/|PSScriptAnalyzerSettings\.psd1)'
              if ($changed -match $ruleFiles) { $full = $true }
          }
          if ($full) {
              ./tools/Invoke-Lint.ps1 -FailOn Warning -Path $roots
          } else {
              $files = @($changed | Where-Object {
                      $f = $_
                      $f -match '\.(ps1|psm1)$' -and (Test-Path $f) -and
                      ($roots | Where-Object { $f -like "$_/*" })
                  })
              Write-Host "PR scope (${{ matrix.scope }}): $($files.Count) changed PowerShell file(s)."
              ./tools/Invoke-Lint.ps1 -FailOn Warning -Path $files
          }

  # Branch protection requires a check named lint, and a required check matches by
  # name: the shards report per scope, so this one job answers for all of them.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-shard
    # always(), or a failed shard skips this job and the required check never lands.
    if: always()
    steps:
      - name: Fail on any failed shard
        if: needs.lint-shard.result != 'success'
        run: exit 1

  tests-shard:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, matching the no-FailFast rule in testing.md.
      fail-fast: false
      matrix:
        # Unit splits between runners, never runspaces: the module-load deadlock
        # (decisions.md) is on a per-process lock, so separate VMs share nothing.
        # Two shards halve Unit's ~70s, which set the whole run's wall clock;
        # finer cuts would only re-buy each job's ~15s of setup.
        scope: [Unit-even, Unit-odd, Integration]
    steps:
      - uses: actions/checkout@v7

      # Keyed on the pinned version below, so bumping the pin refills the cache.
      - uses: actions/cache@v6
        with:
          path: ~/Documents/PowerShell/Modules
          key: psmodules-pester-6.0.1

      # Guarded on presence, so a cache hit skips the gallery instead of reinstalling.
      - name: Install PowerShell modules
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq '6.0.1' })) {
              Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force
          }

      # The Unit shards split the file list by alternating index: the partition
      # is total by construction, so a new test file cannot escape the matrix,
      # and alternation keeps heavy alphabetical neighbours apart. Pester only
      # discovers *.Tests.ps1, so the explicit list runs what the directory would.
      - name: Tests
        shell: pwsh
        run: |
          $scope = '${{ matrix.scope }}'
          $paths = if ($scope -eq 'Integration') {
              'tests/Integration'
          } else {
              $files = @(git ls-files 'tests/Unit/*.Tests.ps1')
              if (-not $files) { throw 'No Unit test files discovered.' }
              $parity = if ($scope -eq 'Unit-even') { 0 } else { 1 }
              $mine = @(0..($files.Count - 1) | Where-Object { ($_ % 2) -eq $parity } |
                      ForEach-Object { $files[$_] })
              Write-Host "${scope}: $($mine.Count) of $($files.Count) Unit files."
              $mine
          }
          ./tools/Invoke-Tests.ps1 -Path $paths

  # Branch protection requires a check named tests, and a required check matches
  # by name: the shards report per scope, so this one job answers for all of them.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests-shard
    # always(), or a failed shard skips this job and the required check never lands.
    if: always()
    steps:
      - name: Fail on any failed shard
        if: needs.tests-shard.result != 'success'
        run: exit 1

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No setup-dotnet: the image ships the .NET 10 SDK, and the action spent 18
      # of this job's ~60s confirming "already installed" (measured, run 33133178956).
      # If the image ever drops the major, restore the pin (release.yml keeps one).

      # Restoring the Microsoft.PowerShell.SDK graph is most of the build when uncached.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: nuget-

      - name: Build launcher
        run: dotnet build DONUT.sln -c Release
