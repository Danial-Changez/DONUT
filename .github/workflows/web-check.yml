name: Web checks

# Format, lint, type-check, and build the docs site. Runs independently of the
# deploy (docs.yml) so an issue surfaces as a failed check without blocking the
# site from shipping. The build matters: `astro check` does not compile MDX
# expressions, and content lives in docs/, so both trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Format check, lint, and type-check
        run: npm run verify
        working-directory: web

      # The production base comes from GITHUB_REPOSITORY, which Actions always sets.
      - name: Build
        run: npm run build
        working-directory: web
