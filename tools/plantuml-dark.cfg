' DONUT dark theme for PlantUML, injected at render time via -config so the
' .puml sources stay theme-agnostic. Palette mirrors the docs site / app
' (src/UI/Styles/UIColors.xaml): #0a0a0a page, #121212 panels, #3F3F46
' borders, #D4D4D4 body text, #FAFAFA titles, #8E51FF violet accent.
' Background stays transparent so the site's page color shows through.

skinparam backgroundColor transparent
skinparam shadowing false
skinparam defaultFontName sans-serif
skinparam defaultFontColor #D4D4D4
skinparam TitleFontColor #FAFAFA
skinparam ArrowColor #8A8A8A
skinparam ArrowFontColor #A1A1A1

' Notes: violet-washed panel (readable, clearly a note, no default yellow)
skinparam NoteBackgroundColor #1E1631
skinparam NoteBorderColor #6D5AA8
skinparam NoteFontColor #D4D4D4

' Sequence (participant boxes use the un-prefixed names; the Sequence-prefixed
' variants are silently ignored by current PlantUML)
skinparam ParticipantBackgroundColor #121212
skinparam ParticipantBorderColor #3F3F46
skinparam ParticipantFontColor #FAFAFA
skinparam SequenceLifeLineBorderColor #3F3F46
skinparam SequenceLifeLineBackgroundColor #27272A
skinparam SequenceGroupBackgroundColor #121212
skinparam SequenceGroupBorderColor #3F3F46
skinparam SequenceGroupHeaderFontColor #FAFAFA
skinparam SequenceGroupFontColor #D4D4D4
skinparam SequenceDividerBackgroundColor #121212
skinparam SequenceDividerBorderColor #3F3F46
skinparam SequenceDividerFontColor #FAFAFA
skinparam SequenceBoxBackgroundColor #0F0F0F
skinparam SequenceBoxBorderColor #3F3F46
skinparam SequenceBoxFontColor #FAFAFA
skinparam SequenceReferenceBackgroundColor #121212
skinparam SequenceReferenceBorderColor #3F3F46
skinparam SequenceReferenceHeaderBackgroundColor #1E1631
skinparam ActorBackgroundColor #121212
skinparam ActorBorderColor #8E51FF
skinparam ActorFontColor #FAFAFA

' Activity / state
skinparam ActivityBackgroundColor #121212
skinparam ActivityBorderColor #3F3F46
skinparam ActivityFontColor #D4D4D4
skinparam ActivityDiamondBackgroundColor #121212
skinparam ActivityDiamondBorderColor #8E51FF
skinparam ActivityDiamondFontColor #D4D4D4
skinparam ActivityStartColor #8E51FF
skinparam ActivityEndColor #8E51FF
skinparam ActivityBarColor #8E51FF
skinparam PartitionBorderColor #3F3F46
skinparam PartitionFontColor #FAFAFA
skinparam StateBackgroundColor #121212
skinparam StateBorderColor #3F3F46
skinparam StateFontColor #D4D4D4

' Class
skinparam ClassBackgroundColor #121212
skinparam ClassBorderColor #3F3F46
skinparam ClassFontColor #FAFAFA
skinparam ClassAttributeFontColor #D4D4D4
skinparam ClassStereotypeFontColor #A1A1A1
skinparam ClassHeaderBackgroundColor #1A1A1D
' The circled C/I/A/E type spots default to pastel green; wash them violet.
skinparam stereotypeCBackgroundColor #2A1656
skinparam stereotypeIBackgroundColor #2A1656
skinparam stereotypeABackgroundColor #2A1656
skinparam stereotypeEBackgroundColor #2A1656
skinparam stereotypeNBackgroundColor #2A1656

' Component / deployment / packages
skinparam ComponentBackgroundColor #121212
skinparam ComponentBorderColor #3F3F46
skinparam ComponentFontColor #FAFAFA
skinparam InterfaceBackgroundColor #121212
skinparam InterfaceBorderColor #8E51FF
skinparam PackageBackgroundColor #0F0F0F
skinparam PackageBorderColor #3F3F46
skinparam PackageFontColor #FAFAFA
skinparam DatabaseBackgroundColor #121212
skinparam DatabaseBorderColor #3F3F46
skinparam QueueBackgroundColor #121212
skinparam QueueBorderColor #3F3F46
skinparam RectangleBackgroundColor #121212
skinparam RectangleBorderColor #3F3F46
skinparam RectangleFontColor #FAFAFA
skinparam FrameBackgroundColor #0F0F0F
skinparam FrameBorderColor #3F3F46
skinparam FrameFontColor #FAFAFA
skinparam LegendBackgroundColor #121212
skinparam LegendBorderColor #3F3F46
skinparam LegendFontColor #D4D4D4
